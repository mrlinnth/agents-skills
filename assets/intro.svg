<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1760" viewBox="0 0 1000 1760" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Skills Workflow</title>
  <desc id="desc">Portrait infographic: project-kickoff, prototype, feature-planner, task-runner, reviewer, and git-workflow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f2f7"/>
      <stop offset="1" stop-color="#e4e8f2"/>
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1e2d5e" flood-opacity="0.09"/>
    </filter>

    <filter id="elevated-shadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#1e2d5e" flood-opacity="0.18"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      text { font-family: "Inter", "Helvetica Neue", "Arial", sans-serif; }
      .eyebrow   { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; fill: #6b7db3; }
      .hero-title { font-size: 52px; font-weight: 700; fill: #1e2d5e; }
      .hero-sub  { font-size: 18px; font-weight: 400; fill: #5a6a96; }
      .why-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #8a96bc; }
      .why-body  { font-size: 16px; fill: #c8d0e8; }
      .step-num  { font-size: 80px; font-weight: 700; fill: #1e2d5e; opacity: 0.05; }
      .step-name { font-size: 18px; font-weight: 700; fill: #1e2d5e; }
      .step-body { font-size: 13px; font-weight: 400; fill: #5a6a96; }
      .file-name { font-size: 13px; font-weight: 700; fill: #1e2d5e;
                   font-family: "JetBrains Mono","SF Mono","Fira Code","Consolas",monospace; }
      .file-desc { font-size: 12px; fill: #6b7db3; }
      .file-by   { font-size: 10px; font-weight: 600; fill: #a0aac8; letter-spacing: 0.4px; }
      .no-files  { font-size: 12px; font-weight: 600; fill: #b0bbd4; font-style: italic; }
      .footer-text { font-size: 15px; font-weight: 700; fill: #f0f2f7; }
      .section-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #8a96bc; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1760" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1000" height="4" fill="#1e2d5e"/>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <!-- y starts at 32, leaves room below accent bar -->
  <text class="eyebrow" x="60" y="46" font-family="Inter,Helvetica Neue,Arial,sans-serif">REPO OVERVIEW</text>
  <text class="hero-title" x="60" y="108" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="52" fill="#1e2d5e">AI Agent Skills Workflow</text>
  <text class="hero-sub" x="60" y="142">A repeatable six-skill system for AI coding agents.</text>
  <text class="hero-sub" x="60" y="166">Plan, prototype, execute, review, and resume without losing state.</text>

  <!-- Why card: x=60, width=880, y=192 -->
  <g transform="translate(60 192)">
    <rect x="0" y="0" width="880" height="100" rx="14" fill="#1e2d5e" filter="url(#elevated-shadow)"/>
    <text class="why-label" x="24" y="30">WHY THIS REPO EXISTS</text>
    <text class="why-body" x="24" y="60">Project state lives in files and branch state, not chat history.</text>
    <text class="why-body" x="24" y="84">Work spans sessions, agents, and reviews — without reconstruction.</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="312" x2="940" y2="312" stroke="#c8cfe8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════
       ROW LAYOUT
       Skill column:  x=60,  width=260
       Gap:           x=320, width=40  (connector lives here)
       File column:   x=360, width=580
       Row height: 160px card + 50px connector gap = 210px per row
       Row y starts: 330
       Row tops: 330 / 540 / 750 / 960 / 1170 / 1380
       Card bottoms: 490 / 700 / 910 / 1120 / 1330 / 1540
       Connector midpoints (vertical): 515 / 725 / 935 / 1145 / 1355
       (between card bottom and next card top, centered)
  ═══════════════════════════════════════════════════════════ -->

  <!-- ── ROW 1: project-kickoff ── -->
  <!-- Skill card -->
  <g transform="translate(60 330)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="160" rx="2.5" fill="#3d7a6f"/>
    <text class="step-num" x="148" y="96">01</text>
    <!-- icon: plus -->
    <circle cx="50" cy="48" r="26" fill="#eaf4f2"/>
    <line x1="50" y1="36" x2="50" y2="60" stroke="#3d7a6f" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="48" x2="62" y2="48" stroke="#3d7a6f" stroke-width="5" stroke-linecap="round"/>
    <text class="step-name" x="18" y="100">project-kickoff</text>
    <text class="step-body" x="18" y="120">Captures product scope, users,</text>
    <text class="step-body" x="18" y="137">stack, versions, and rules.</text>
  </g>
  <!-- Horizontal connector: skill right edge → file left edge, at card mid y=330+80=410 -->
  <line x1="320" y1="410" x2="354" y2="410" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="350,405 360,410 350,415" fill="#c8cfe8"/>
  <!-- File cards: stacked, x=360, each 280wide 70tall, gap 10 -->
  <!-- File 1 top: y=330+(160-150)/2=330+5=335, height 70 -->
  <g transform="translate(360 335)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#3d7a6f"/>
    <text class="file-name" x="16" y="24">ai/PRD.md</text>
    <text class="file-desc" x="16" y="42">Product goals, users, features, and scope.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY project-kickoff</text>
  </g>
  <!-- File 2 top: y=335+68+8=411 -->
  <g transform="translate(360 411)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#3d7a6f"/>
    <text class="file-name" x="16" y="24">ai/CONSTRAINTS.md</text>
    <text class="file-desc" x="16" y="42">Stack, conventions, and verification command.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY project-kickoff</text>
  </g>

  <!-- Vertical connector 1→2 -->
  <line x1="190" y1="490" x2="190" y2="534" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="184,530 190,542 196,530" fill="#c8cfe8"/>

  <!-- ── ROW 2: prototype ── -->
  <g transform="translate(60 540)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="160" rx="2.5" fill="#4f8f8a"/>
    <text class="step-num" x="148" y="96">02</text>
    <!-- icon: layered frames -->
    <circle cx="50" cy="48" r="26" fill="#e7f4f3"/>
    <rect x="37" y="36" width="22" height="16" rx="3" fill="none" stroke="#4f8f8a" stroke-width="4"/>
    <rect x="42" y="42" width="22" height="16" rx="3" fill="none" stroke="#4f8f8a" stroke-width="4" opacity="0.55"/>
    <text class="step-name" x="18" y="100">prototype</text>
    <text class="step-body" x="18" y="120">Shapes UI, layout, and interactions</text>
    <text class="step-body" x="18" y="137">before planning is locked in.</text>
  </g>
  <line x1="320" y1="620" x2="354" y2="620" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="350,615 360,620 350,625" fill="#c8cfe8"/>
  <g transform="translate(360 545)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#4f8f8a"/>
    <text class="file-name" x="16" y="24">ai/prototype/index.html</text>
    <text class="file-desc" x="16" y="42">Static interactive UI prototype for review.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY prototype</text>
  </g>
  <g transform="translate(360 621)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#4f8f8a"/>
    <text class="file-name" x="16" y="24">ai/prototype/blueprint.md</text>
    <text class="file-desc" x="16" y="42">Machine-readable screen map for planning.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY prototype</text>
  </g>

  <!-- Vertical connector 2→3 -->
  <line x1="190" y1="700" x2="190" y2="744" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="184,740 190,752 196,740" fill="#c8cfe8"/>

  <!-- ── ROW 3: feature-planner ── -->
  <g transform="translate(60 750)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="160" rx="2.5" fill="#6457a6"/>
    <text class="step-num" x="148" y="96">03</text>
    <!-- icon: list lines -->
    <circle cx="50" cy="48" r="26" fill="#edeaf7"/>
    <line x1="36" y1="38" x2="64" y2="38" stroke="#6457a6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="36" y1="49" x2="64" y2="49" stroke="#6457a6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="36" y1="60" x2="52" y2="60" stroke="#6457a6" stroke-width="4.5" stroke-linecap="round"/>
    <text class="step-name" x="18" y="100">feature-planner</text>
    <text class="step-body" x="18" y="120">Turns a feature idea into</text>
    <text class="step-body" x="18" y="137">requirements and task plans.</text>
  </g>
  <line x1="320" y1="830" x2="354" y2="830" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="350,825 360,830 350,835" fill="#c8cfe8"/>
  <!-- Single file card, vertically centered in row -->
  <g transform="translate(360 791)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#6457a6"/>
    <text class="file-name" x="16" y="24">ai/plans/&lt;feature&gt;/</text>
    <text class="file-desc" x="16" y="42">Per-feature requirements and numbered task files.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY feature-planner</text>
  </g>

  <!-- Vertical connector 3→4 -->
  <line x1="190" y1="910" x2="190" y2="954" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="184,950 190,962 196,950" fill="#c8cfe8"/>

  <!-- ── ROW 4: task-runner ── -->
  <g transform="translate(60 960)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="160" rx="2.5" fill="#e8a030"/>
    <text class="step-num" x="148" y="96">04</text>
    <!-- icon: play -->
    <circle cx="50" cy="48" r="26" fill="#fdf3e3"/>
    <polygon points="42,36 42,60 66,48" fill="#e8a030"/>
    <text class="step-name" x="18" y="100">task-runner</text>
    <text class="step-body" x="18" y="120">Executes one task at a time,</text>
    <text class="step-body" x="18" y="137">tracks progress, writes handoffs.</text>
  </g>
  <line x1="320" y1="1040" x2="354" y2="1040" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="350,1035 360,1040 350,1045" fill="#c8cfe8"/>
  <g transform="translate(360 965)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#e8a030"/>
    <text class="file-name" x="16" y="24">ai/PROGRESS.md</text>
    <text class="file-desc" x="16" y="42">Current feature, task, status, and next step.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY task-runner</text>
  </g>
  <g transform="translate(360 1041)">
    <rect x="0" y="0" width="575" height="68" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#e8a030"/>
    <text class="file-name" x="16" y="24">ai/handoff/*</text>
    <text class="file-desc" x="16" y="42">Expanded task context for another model or session.</text>
    <text class="file-by" x="16" y="60">WRITTEN BY task-runner</text>
  </g>

  <!-- Vertical connector 4→5 -->
  <line x1="190" y1="1120" x2="190" y2="1164" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="184,1160 190,1172 196,1160" fill="#c8cfe8"/>

  <!-- ── ROW 5: reviewer ── -->
  <g transform="translate(60 1170)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="160" rx="2.5" fill="#c0544a"/>
    <text class="step-num" x="148" y="96">05</text>
    <!-- icon: magnifier -->
    <circle cx="50" cy="48" r="26" fill="#f5e8e7"/>
    <circle cx="47" cy="45" r="11" fill="none" stroke="#c0544a" stroke-width="4.5"/>
    <line x1="55" y1="53" x2="65" y2="63" stroke="#c0544a" stroke-width="4.5" stroke-linecap="round"/>
    <text class="step-name" x="18" y="100">reviewer</text>
    <text class="step-body" x="18" y="120">Checks the diff against constraints</text>
    <text class="step-body" x="18" y="137">and plans, then drafts the PR.</text>
  </g>
  <!-- No file cards — explicit label -->
  <text class="no-files" x="376" y="1243">No files written to ai/ — reads diff, plans, and constraints.</text>
  <text class="no-files" x="376" y="1263">Outputs a PR description draft outside the ai/ directory.</text>

  <!-- Vertical connector 5→6 -->
  <line x1="190" y1="1330" x2="190" y2="1374" stroke="#c8cfe8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="184,1370 190,1382 196,1370" fill="#c8cfe8"/>

  <!-- ── ROW 6: git-workflow ── -->
  <g transform="translate(60 1380)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="160" rx="2.5" fill="#3a6fa8"/>
    <text class="step-num" x="148" y="96">06</text>
    <!-- icon: branch -->
    <circle cx="50" cy="48" r="26" fill="#e5eef7"/>
    <circle cx="42" cy="38" r="5" fill="#3a6fa8"/>
    <circle cx="58" cy="38" r="5" fill="#3a6fa8"/>
    <circle cx="50" cy="58" r="5" fill="#3a6fa8"/>
    <line x1="42" y1="43" x2="50" y2="53" stroke="#3a6fa8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="58" y1="43" x2="50" y2="53" stroke="#3a6fa8" stroke-width="3.5" stroke-linecap="round"/>
    <text class="step-name" x="18" y="100">git-workflow</text>
    <text class="step-body" x="18" y="120">Keeps changes on safe branches</text>
    <text class="step-body" x="18" y="137">with clean commit checkpoints.</text>
  </g>
  <!-- No file cards — explicit label -->
  <text class="no-files" x="376" y="1453">No files written to ai/ — manages branch state,</text>
  <text class="no-files" x="376" y="1473">commits, and merges via bash scripts.</text>

  <!-- ═══════════════ FOOTER ═══════════════ -->
  <!-- y=1590, height=80, bottom at 1670, canvas 1760 → 90px margin below -->
  <g transform="translate(60 1620)">
    <rect x="0" y="0" width="880" height="72" rx="12" fill="#1e2d5e"/>
    <text class="footer-text" x="440" y="43" text-anchor="middle" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="15" fill="#f0f2f7">
      Plan once. Prototype early. Execute in small units. Review before merge. Resume from files.
    </text>
  </g>

</svg>
