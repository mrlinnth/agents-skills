<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Skills Workflow</title>
  <desc id="desc">A one-page infographic showing how project-kickoff, feature-planner, task-runner, reviewer, and git-workflow create durable context for AI coding agents.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f2f7"/>
      <stop offset="1" stop-color="#e8ebf4"/>
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1e2d5e" flood-opacity="0.08"/>
    </filter>

    <filter id="elevated-shadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#1e2d5e" flood-opacity="0.18"/>
    </filter>

    <pattern id="dotgrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#c5cae0" opacity="0.5"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      text { font-family: "Inter", "Helvetica Neue", "Arial", sans-serif; }
      .eyebrow {
        font-size: 13px; font-weight: 700; letter-spacing: 2.5px; fill: #6b7db3;
      }
      .hero-title {
        font-size: 60px; font-weight: 700; fill: #1e2d5e;
      }
      .hero-sub {
        font-size: 20px; font-weight: 400; fill: #5a6a96;
      }
      .why-title {
        font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #f0f2f7;
      }
      .why-body {
        font-size: 17px; fill: #c8d0e8;
      }
      .step-num {
        font-size: 88px; font-weight: 700; fill: #1e2d5e; opacity: 0.06;
      }
      .step-name {
        font-size: 20px; font-weight: 700; fill: #1e2d5e;
      }
      .step-body {
        font-size: 14.5px; font-weight: 400; fill: #5a6a96;
      }
      .section-label {
        font-size: 12px; font-weight: 700; letter-spacing: 2.5px; fill: #8a96bc;
      }
      .file-name {
        font-size: 14px; font-weight: 700; fill: #1e2d5e;
        font-family: "JetBrains Mono", "SF Mono", "Fira Code", "Consolas", monospace;
      }
      .file-desc {
        font-size: 13px; fill: #6b7db3;
      }
      .file-by {
        font-size: 11px; font-weight: 600; fill: #a0aac8; letter-spacing: 0.5px;
      }
      .footer-text {
        font-size: 18px; font-weight: 700; fill: #f0f2f7;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect x="900" y="0" width="700" height="320" fill="url(#dotgrid)"/>

  <!-- Top accent line — indigo only, no amber segment -->
  <rect x="0" y="0" width="1600" height="4" fill="#1e2d5e"/>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <g transform="translate(80 52)">
    <text class="eyebrow" x="2" y="0">REPO OVERVIEW</text>
    <text class="hero-title" x="0" y="64" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="60">AI Agent Skills Workflow</text>
    <text class="hero-sub" x="2" y="102">A repeatable file-based system for AI coding agents —</text>
    <text class="hero-sub" x="2" y="128">plan, execute, review, and resume without losing state.</text>
  </g>

  <!-- Why card — no left bar -->
  <g transform="translate(1058 44)">
    <rect x="0" y="0" width="462" height="136" rx="16" fill="#1e2d5e" filter="url(#elevated-shadow)"/>
    <text class="why-title" x="24" y="38" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="13">WHY THIS REPO EXISTS</text>
    <text class="why-body" x="24" y="72">Project state lives in files, not chat history.</text>
    <text class="why-body" x="24" y="98">Work spans sessions, agents, and code reviews</text>
    <text class="why-body" x="24" y="124">without reconstruction.</text>
  </g>

  <!-- Divider -->
  <line x1="80" y1="215" x2="1520" y2="215" stroke="#c8cfe8" stroke-width="1"/>

  <!-- ═══════════════ FLOW LINE ═══════════════ -->
  <line x1="146" y1="316" x2="1454" y2="316" stroke="#c8cfe8" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ═══════════════ STEP CARDS ═══════════════ -->
  <!--
    Color system:
    A project-kickoff  #3d7a6f  sage green     icon bg #eaf4f2
    B feature-planner  #6457a6  indigo violet  icon bg #edeaf7
    C task-runner      #e8a030  amber          icon bg #fdf3e3
    D reviewer         #c0544a  terracotta     icon bg #f5e8e7
    E git-workflow     #3a6fa8  steel blue     icon bg #e5eef7
  -->

  <!-- 01 project-kickoff — A #3d7a6f -->
  <g transform="translate(80 230)">
    <rect x="0" y="0" width="238" height="272" rx="16" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="272" rx="2.5" fill="#3d7a6f"/>
    <text class="step-num" x="140" y="88">01</text>
    <circle cx="52" cy="62" r="28" fill="#eaf4f2"/>
    <line x1="52" y1="50" x2="52" y2="74" stroke="#3d7a6f" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="40" y1="62" x2="64" y2="62" stroke="#3d7a6f" stroke-width="5.5" stroke-linecap="round"/>
    <text class="step-name" x="20" y="124">project-kickoff</text>
    <text class="step-body" x="20" y="152">Captures product scope,</text>
    <text class="step-body" x="20" y="173">users, stack, versions,</text>
    <text class="step-body" x="20" y="194">and verification rules.</text>
  </g>

  <!-- Arrow 1→2 -->
  <polygon points="326,308 342,316 326,324" fill="#6b7db3"/>

  <!-- 02 feature-planner — B #6457a6 -->
  <g transform="translate(354 230)">
    <rect x="0" y="0" width="238" height="272" rx="16" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="272" rx="2.5" fill="#6457a6"/>
    <text class="step-num" x="140" y="88">02</text>
    <circle cx="52" cy="62" r="28" fill="#edeaf7"/>
    <line x1="38" y1="51" x2="66" y2="51" stroke="#6457a6" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="63" x2="66" y2="63" stroke="#6457a6" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="75" x2="55" y2="75" stroke="#6457a6" stroke-width="5" stroke-linecap="round"/>
    <text class="step-name" x="20" y="124">feature-planner</text>
    <text class="step-body" x="20" y="152">Turns a feature idea into</text>
    <text class="step-body" x="20" y="173">requirements and ordered</text>
    <text class="step-body" x="20" y="194">task plans.</text>
  </g>

  <!-- Arrow 2→3 -->
  <polygon points="600,308 616,316 600,324" fill="#6b7db3"/>

  <!-- 03 task-runner — C #e8a030 -->
  <g transform="translate(628 230)">
    <rect x="0" y="0" width="238" height="272" rx="16" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="272" rx="2.5" fill="#e8a030"/>
    <text class="step-num" x="140" y="88">03</text>
    <circle cx="52" cy="62" r="28" fill="#fdf3e3"/>
    <polygon points="44,50 44,74 68,62" fill="#e8a030"/>
    <text class="step-name" x="20" y="124">task-runner</text>
    <text class="step-body" x="20" y="152">Executes one task at a</text>
    <text class="step-body" x="20" y="173">time, tracks progress,</text>
    <text class="step-body" x="20" y="194">and writes handoffs.</text>
  </g>

  <!-- Arrow 3→4 -->
  <polygon points="874,308 890,316 874,324" fill="#6b7db3"/>

  <!-- 04 reviewer — D #c0544a -->
  <g transform="translate(902 230)">
    <rect x="0" y="0" width="238" height="272" rx="16" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="272" rx="2.5" fill="#c0544a"/>
    <text class="step-num" x="140" y="88">04</text>
    <circle cx="52" cy="62" r="28" fill="#f5e8e7"/>
    <circle cx="49" cy="59" r="11" fill="none" stroke="#c0544a" stroke-width="5"/>
    <line x1="57" y1="67" x2="67" y2="77" stroke="#c0544a" stroke-width="5" stroke-linecap="round"/>
    <text class="step-name" x="20" y="124">reviewer</text>
    <text class="step-body" x="20" y="152">Checks the diff against</text>
    <text class="step-body" x="20" y="173">constraints and plans,</text>
    <text class="step-body" x="20" y="194">then drafts the PR.</text>
  </g>

  <!-- Arrow 4→5 -->
  <polygon points="1148,308 1164,316 1148,324" fill="#6b7db3"/>

  <!-- 05 git-workflow — E #3a6fa8 -->
  <g transform="translate(1176 230)">
    <rect x="0" y="0" width="238" height="272" rx="16" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="272" rx="2.5" fill="#3a6fa8"/>
    <text class="step-num" x="140" y="88">05</text>
    <circle cx="52" cy="62" r="28" fill="#e5eef7"/>
    <circle cx="44" cy="52" r="5" fill="#3a6fa8"/>
    <circle cx="60" cy="52" r="5" fill="#3a6fa8"/>
    <circle cx="52" cy="72" r="5" fill="#3a6fa8"/>
    <line x1="44" y1="57" x2="52" y2="67" stroke="#3a6fa8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="57" x2="52" y2="67" stroke="#3a6fa8" stroke-width="3.5" stroke-linecap="round"/>
    <text class="step-name" x="20" y="124">git-workflow</text>
    <text class="step-body" x="20" y="152">Keeps changes on safe</text>
    <text class="step-body" x="20" y="173">branches with clean</text>
    <text class="step-body" x="20" y="194">commit checkpoints.</text>
  </g>

  <!-- ═══════════════ SHARED MEMORY SECTION ═══════════════ -->

  <text class="section-label" x="80" y="558">FILES BECOME THE SHARED MEMORY</text>
  <line x1="80" y1="570" x2="1520" y2="570" stroke="#c8cfe8" stroke-width="1"/>
  <text x="80" y="594" style="font-size:14px; fill:#8a96bc; font-family: Inter, Helvetica Neue, Arial, sans-serif;">
    Each skill writes files that the next can read without reconstructing chat history. Files are ordered by when they are created.
  </text>

  <!-- File cards: x 80 / 368 / 656 / 944 / 1232, width 260 -->

  <!-- ai/PRD.md — A #3d7a6f -->
  <g transform="translate(80 614)">
    <rect x="0" y="0" width="260" height="118" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="118" rx="2.5" fill="#3d7a6f"/>
    <text class="file-name" x="20" y="34">ai/PRD.md</text>
    <text class="file-desc" x="20" y="58">Product goals, users,</text>
    <text class="file-desc" x="20" y="76">features, and scope.</text>
    <text class="file-by" x="20" y="102">WRITTEN BY project-kickoff</text>
  </g>

  <!-- ai/CONSTRAINTS.md — A #3d7a6f -->
  <g transform="translate(368 614)">
    <rect x="0" y="0" width="260" height="118" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="118" rx="2.5" fill="#3d7a6f"/>
    <text class="file-name" x="20" y="34">ai/CONSTRAINTS.md</text>
    <text class="file-desc" x="20" y="58">Stack, conventions,</text>
    <text class="file-desc" x="20" y="76">verification command.</text>
    <text class="file-by" x="20" y="102">WRITTEN BY project-kickoff</text>
  </g>

  <!-- ai/plans/* — B #6457a6 -->
  <g transform="translate(656 614)">
    <rect x="0" y="0" width="260" height="118" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="118" rx="2.5" fill="#6457a6"/>
    <text class="file-name" x="20" y="34">ai/plans/*</text>
    <text class="file-desc" x="20" y="58">Feature requirements</text>
    <text class="file-desc" x="20" y="76">and atomic tasks.</text>
    <text class="file-by" x="20" y="102">WRITTEN BY feature-planner</text>
  </g>

  <!-- ai/PROGRESS.md — C #e8a030 -->
  <g transform="translate(944 614)">
    <rect x="0" y="0" width="260" height="118" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="118" rx="2.5" fill="#e8a030"/>
    <text class="file-name" x="20" y="34">ai/PROGRESS.md</text>
    <text class="file-desc" x="20" y="58">Current feature, task,</text>
    <text class="file-desc" x="20" y="76">status, and next step.</text>
    <text class="file-by" x="20" y="102">WRITTEN BY task-runner</text>
  </g>

  <!-- ai/handoff/* — C #e8a030 -->
  <g transform="translate(1232 614)">
    <rect x="0" y="0" width="260" height="118" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="5" height="118" rx="2.5" fill="#e8a030"/>
    <text class="file-name" x="20" y="34">ai/handoff/*</text>
    <text class="file-desc" x="20" y="58">Expanded task context</text>
    <text class="file-desc" x="20" y="76">for another model.</text>
    <text class="file-by" x="20" y="102">WRITTEN BY task-runner</text>
  </g>

  <!-- ═══════════════ FOOTER — no left bar ═══════════════ -->
  <g transform="translate(80 782)">
    <rect x="0" y="0" width="1440" height="64" rx="12" fill="#1e2d5e"/>
    <text class="footer-text" x="720" y="39" text-anchor="middle">
      Plan once.  Execute in small units.  Review before merge.  Commit checkpoints.  Resume from files.
    </text>
  </g>

</svg>
