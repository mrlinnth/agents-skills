<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Skills Workflow</title>
  <desc id="desc">A one-page infographic showing how project-kickoff, feature-planner, task-runner, and git-workflow create durable context for AI coding agents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="0.55" stop-color="#f3f7f1"/>
      <stop offset="1" stop-color="#eef5f6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#23303a" flood-opacity="0.12"/>
    </filter>
    <pattern id="pinstripe" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="none"/>
      <path d="M0 0H28" stroke="#d9e4df" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#394653"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans", "DejaVu Sans", sans-serif;
        fill: #22313b;
      }
      .eyebrow {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
        fill: #4c6b62;
      }
      .title {
        font-size: 66px;
        font-weight: 800;
      }
      .subtitle {
        font-size: 26px;
        fill: #50616a;
      }
      .panel-title {
        font-size: 30px;
        font-weight: 800;
      }
      .panel-copy {
        font-size: 20px;
        fill: #52636b;
      }
      .file-label {
        font-size: 20px;
        font-weight: 700;
      }
      .file-copy {
        font-size: 17px;
        fill: #5d6970;
      }
      .small {
        font-size: 17px;
        fill: #617078;
      }
      .mono {
        font-family: "Noto Sans Mono", "DejaVu Sans Mono", monospace;
        font-size: 17px;
        fill: #4b5960;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#f5f8f3"/>

  <circle cx="1385" cy="138" r="120" fill="#e5f2ec" opacity="0.9"/>
  <circle cx="1455" cy="223" r="42" fill="#f7d977" opacity="0.55"/>
  <path d="M118 850C218 782 303 788 384 846C480 915 571 903 660 836" fill="none" stroke="#dbe9e4" stroke-width="42" stroke-linecap="round" opacity="0.72"/>

  <g transform="translate(92 72)">
    <text class="eyebrow" x="0" y="0">REPO OVERVIEW</text>
    <text class="title" x="0" y="72">AI Agent Skills Workflow</text>
    <text class="subtitle" x="0" y="120">A repeatable file-based system for AI coding agents.</text>
    <text class="subtitle" x="0" y="154">Plan features, run tasks, hand off context, and resume without losing state.</text>
  </g>

  <g transform="translate(1040 82)">
    <rect x="0" y="0" width="450" height="128" rx="18" fill="#22313b" filter="url(#soft-shadow)"/>
    <text x="32" y="42" fill="#f8fbf8" font-size="22" font-weight="800">Why this repo exists</text>
    <text x="32" y="78" fill="#dbe7df" font-size="19">Important project state is written to files,</text>
    <text x="32" y="106" fill="#dbe7df" font-size="19">so work can span sessions and models.</text>
  </g>

  <g transform="translate(98 250)">
    <rect x="0" y="0" width="314" height="268" rx="20" fill="#ffffff" stroke="#d8e2dc" stroke-width="2" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="314" height="14" rx="7" fill="#2f9d8c"/>
    <circle cx="54" cy="72" r="32" fill="#dff3ee"/>
    <path d="M41 72H67M54 59V85" stroke="#1f7f71" stroke-width="7" stroke-linecap="round"/>
    <text class="panel-title" x="31" y="124">project-kickoff</text>
    <text class="panel-copy" x="31" y="164">Captures product scope,</text>
    <text class="panel-copy" x="31" y="192">users, stack, versions,</text>
    <text class="panel-copy" x="31" y="220">and verification rules.</text>
    <rect x="31" y="236" width="252" height="1" fill="#e2ebe6"/>
  </g>

  <g transform="translate(467 250)">
    <rect x="0" y="0" width="314" height="268" rx="20" fill="#ffffff" stroke="#d8e2dc" stroke-width="2" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="314" height="14" rx="7" fill="#cf695e"/>
    <circle cx="54" cy="72" r="32" fill="#f8e6e2"/>
    <path d="M40 61H69M40 73H69M40 85H58" stroke="#a9443a" stroke-width="7" stroke-linecap="round"/>
    <text class="panel-title" x="31" y="124">feature-planner</text>
    <text class="panel-copy" x="31" y="164">Turns a feature idea</text>
    <text class="panel-copy" x="31" y="192">into requirements and</text>
    <text class="panel-copy" x="31" y="220">ordered task plans.</text>
    <rect x="31" y="236" width="252" height="1" fill="#e2ebe6"/>
  </g>

  <g transform="translate(836 250)">
    <rect x="0" y="0" width="314" height="268" rx="20" fill="#ffffff" stroke="#d8e2dc" stroke-width="2" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="314" height="14" rx="7" fill="#d6a739"/>
    <circle cx="54" cy="72" r="32" fill="#fbf0cf"/>
    <path d="M39 71L50 82L70 58" stroke="#9a741c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="panel-title" x="31" y="124">task-runner</text>
    <text class="panel-copy" x="31" y="164">Executes one task,</text>
    <text class="panel-copy" x="31" y="192">tracks progress, and</text>
    <text class="panel-copy" x="31" y="220">writes handoffs.</text>
    <rect x="31" y="236" width="252" height="1" fill="#e2ebe6"/>
  </g>

  <g transform="translate(1205 250)">
    <rect x="0" y="0" width="314" height="268" rx="20" fill="#ffffff" stroke="#d8e2dc" stroke-width="2" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="314" height="14" rx="7" fill="#5d7fb8"/>
    <circle cx="54" cy="72" r="32" fill="#e6edf7"/>
    <path d="M43 61H67M43 73H67M43 85H67" stroke="#3d6098" stroke-width="7" stroke-linecap="round"/>
    <circle cx="38" cy="61" r="4" fill="#3d6098"/>
    <circle cx="38" cy="73" r="4" fill="#3d6098"/>
    <circle cx="38" cy="85" r="4" fill="#3d6098"/>
    <text class="panel-title" x="31" y="124">git-workflow</text>
    <text class="panel-copy" x="31" y="164">Keeps changes on safe</text>
    <text class="panel-copy" x="31" y="192">branches with clean</text>
    <text class="panel-copy" x="31" y="220">commit checkpoints.</text>
    <rect x="31" y="236" width="252" height="1" fill="#e2ebe6"/>
  </g>

  <g fill="#394653" stroke="#394653" stroke-width="5" stroke-linecap="round">
    <path d="M421 384H445"/>
    <path d="M790 384H814"/>
    <path d="M1159 384H1183"/>
    <path d="M444 373L456 384L444 395Z" stroke="none"/>
    <path d="M813 373L825 384L813 395Z" stroke="none"/>
    <path d="M1182 373L1194 384L1182 395Z" stroke="none"/>
  </g>

  <g transform="translate(110 580)">
    <rect x="0" y="0" width="1380" height="282" rx="24" fill="#fefefe" stroke="#d9e5df" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="36" y="54" font-size="30" font-weight="800">Files become the shared memory</text>
    <text x="36" y="90" class="small">Each step writes durable context that the next agent or session can read without reconstructing chat history.</text>

    <g transform="translate(36 126)">
      <rect x="0" y="0" width="246" height="104" rx="14" fill="#edf8f4" stroke="#c9e7dd"/>
      <text class="file-label" x="22" y="35">ai/PRD.md</text>
      <text class="file-copy" x="22" y="65">Product goals, users,</text>
      <text class="file-copy" x="22" y="88">features, scope.</text>
    </g>

    <g transform="translate(298 126)">
      <rect x="0" y="0" width="246" height="104" rx="14" fill="#f9ece9" stroke="#efcdc7"/>
      <text class="file-label" x="22" y="35">ai/CONSTRAINTS.md</text>
      <text class="file-copy" x="22" y="65">Stack, conventions,</text>
      <text class="file-copy" x="22" y="88">verification command.</text>
    </g>

    <g transform="translate(560 126)">
      <rect x="0" y="0" width="246" height="104" rx="14" fill="#fbf3d7" stroke="#ead58d"/>
      <text class="file-label" x="22" y="35">ai/plans/*</text>
      <text class="file-copy" x="22" y="65">Feature requirements</text>
      <text class="file-copy" x="22" y="88">and atomic tasks.</text>
    </g>

    <g transform="translate(822 126)">
      <rect x="0" y="0" width="246" height="104" rx="14" fill="#edf2fb" stroke="#cddaf0"/>
      <text class="file-label" x="22" y="35">ai/PROGRESS.md</text>
      <text class="file-copy" x="22" y="65">Current feature, task,</text>
      <text class="file-copy" x="22" y="88">status, next step.</text>
    </g>

    <g transform="translate(1084 126)">
      <rect x="0" y="0" width="246" height="104" rx="14" fill="#f0f2f2" stroke="#d6dddd"/>
      <text class="file-label" x="22" y="35" style="font-size:18px">ai/handoff/</text>
      <text class="file-label" x="122" y="35" style="font-size:18px">*</text>
      <text class="file-copy" x="22" y="65">Expanded task context</text>
      <text class="file-copy" x="22" y="88">for another model.</text>
    </g>
  </g>

  <g transform="translate(248 910)">
    <rect x="0" y="-36" width="1104" height="64" rx="32" fill="#22313b"/>
    <text x="552" y="6" text-anchor="middle" fill="#f7fbf8" font-size="23" font-weight="800">Plan once. Execute in small units. Commit checkpoints. Resume from files.</text>
  </g>
</svg>
